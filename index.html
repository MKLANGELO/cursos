<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Amigurumi Cat&oacute;lico | +150 Receitas de Santinhos</title>
    <style>
        :root { --bg:#fdfaf3; --bg2:#f6efdc; --vinho:#6b1420; --gold:#a9781f; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 20px; }
        h2 { font-family: 'Playfair Display', serif; text-align: center; margin-bottom: 30px; }
        .btn { display: inline-block; background: var(--vinho); color: #fff; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        
        /* Carrossel Simples e Robusto */
        #pecas { background: var(--bg2); padding: 40px 0; overflow: hidden; }
        .pieces-shell { 
            display: flex; overflow: hidden; width: 100%; 
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .pieces { display: flex; gap: 20px; animation: scroll 20s linear infinite; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .piece { 
            flex: 0 0 200px; background: white; border-radius: 8px; 
            text-align: center; padding-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .piece-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px 8px 0 0; }
    </style>
</head>
<body>

<!-- HERO -->
<section id="hero">
    <div class="wrap">
        <h1>Curso de Amigurumi Cat&oacute;lico</h1>
        <p>Aprenda a criar mais de 150 receitas de santinhos.</p>
        <iframe src="https://www.youtube.com/embed/u_JL-LGyqDc?autoplay=1&rel=0" width="100%" height="400" frameborder="0" allowfullscreen></iframe>
        <a href="link_checkout" class="btn">Quero come&ccedil;ar o curso</a>
    </div>
</section>


<!-- PLANOS -->
<section id="planos">
    <div class="wrap" id="ofertas">
        <h2>Escolha seu acesso</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="plan-card">
                <h3>Curso B&aacute;sico</h3>
                <a href="link_checkout" class="btn">QUERO O CURSO B&Aacute;SICO</a>
            </div>
            <div class="plan-card">
                <h3>Curso Completo</h3>
                <a href="link_checkout" class="btn">QUERO O CURSO COMPLETO</a>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="wrap" style="text-align:center;">
        <p>&copy; 2026 Curso de Amigurumi Cat&oacute;lico. Todos os direitos reservados.</p>
    </div>
</footer>

</body>
</html>
